# Static site: everything that goes live is in /site (no build step).
[build]
  publish = "site"
  command = "echo 'static site, no build'"

# Only sebastiancepeda.com is used publicly.
[[redirects]]
  from = "https://sebastiancepedacom.netlify.app/*"
  to = "https://sebastiancepeda.com/:splat"
  status = 301
  force = true

# Old URLs from the previous version of the site
[[redirects]]
  from = "/de/privacy/*"
  to = "/de/datenschutz/"
  status = 301
[[redirects]]
  from = "/es/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
